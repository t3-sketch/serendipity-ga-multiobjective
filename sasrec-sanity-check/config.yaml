MAX_ITEM_LIST_LENGTH: 200
n_layers: 2
n_heads: 1
hidden_size: 50
inner_size: 50
hidden_act: relu
hidden_dropout_prob: 0.2
attn_dropout_prob: 0.2
layer_norm_eps: 1.0e-8
initializer_range: 0.02
loss_type: CE
train_neg_sample_args: null
learner: adam
learning_rate: 0.001
weight_decay: 0.0
train_batch_size: 128
epochs: 200
eval_step: 1
stopping_step: 20
seed: 42
reproducibility: true
metrics: [Hit, NDCG]
topk: [10]
valid_metric: NDCG@10
eval_args:
  split: {LS: valid_and_test}
  order: TO
  group_by: user
  mode: uni100
use_gpu: false
worker: 0
show_progress: false
save_dataset: false
save_dataloaders: false
load_col:
  inter: [user_id, item_id, timestamp]
